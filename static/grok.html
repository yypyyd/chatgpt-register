<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 注册 · ChatGPT 注册管理</title>
<link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body data-page="grok">
<div class="layout">
  <main class="main">
    <h1 class="page-title">Grok 注册</h1>

    <div class="toolbar">
      <input id="grok-count" class="px-input" type="number" min="1" value="1" style="width:120px">
      <button class="px-btn primary" id="grok-produce-btn" onclick="produceGrok()">从账号管理取号注册</button>
      <input id="grok-email" class="px-input search" placeholder="手动测试邮箱">
      <input id="grok-note" class="px-input" placeholder="备注，可选">
      <button class="px-btn" id="grok-start-btn" onclick="startGrok()">手动注册</button>
      <button class="px-btn danger" onclick="deleteAllGrok()">全部删除</button>
    </div>
    <div class="import-sub" style="margin:-6px 0 14px">
      遇到 Cloudflare 时会打开 Chrome 窗口，请手动勾选“Verify you are human”；通过后注册流程会自动继续。
    </div>

    <div class="toolbar">
      <input id="search" class="px-input search" placeholder="搜索 Grok email / 备注 ...">
      <select id="filter-status" class="px-input">
        <option value="">全部状态</option>
        <option value="registering">注册中</option>
        <option value="waiting_code">等待验证码</option>
        <option value="registered">已注册</option>
        <option value="register_failed">注册失败</option>
      </select>
    </div>

    <div class="batch-bar" id="grok-batch" style="display:none">
      <span id="grok-batch-count">已选 0 项</span>
      <button class="px-btn" onclick="downloadSelected()">导出会话</button>
      <button class="px-btn danger" onclick="delSelected()">删除所选</button>
      <button class="px-btn ghost" onclick="clearSelection()">取消</button>
    </div>

    <div class="table-wrap">
      <table class="px-table">
        <thead><tr>
          <th class="col-check"><input type="checkbox" id="grok-check-all" onclick="toggleSelectAll(this.checked)"></th>
          <th>邮箱</th><th>创建时间</th><th>状态</th><th>出库状态</th><th>操作</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<div class="modal-mask" id="code-modal" style="display:none">
  <div class="modal px-panel" style="width:420px">
    <h2 id="code-title">填写 Grok 验证码</h2>
    <div class="import-sub" id="code-sub">等待 Grok 邮件安全代码。</div>
    <label>验证码</label>
    <input id="code-input" class="px-input" maxlength="12" autocomplete="one-time-code">
    <div class="modal-actions">
      <button class="px-btn" onclick="closeModal('code-modal')">取消</button>
      <button class="px-btn primary" onclick="submitCode()">提交验证码</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="log-modal" style="display:none">
  <div class="modal px-panel" style="width:640px">
    <h2 id="log-title">执行日志</h2>
    <pre id="log-body" class="log-body"></pre>
    <div class="modal-actions">
      <button class="px-btn ghost" id="log-shot-btn" style="display:none;margin-right:auto" onclick="viewShot()">异常截图</button>
      <button class="px-btn" onclick="closeLog()">关闭</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="shot-modal" style="display:none">
  <div class="modal px-panel" style="width:900px;max-width:94vw">
    <h2>异常截图</h2>
    <div style="max-height:70vh;overflow:auto;background:#000">
      <img id="shot-img" style="display:block;width:100%" alt="异常截图">
    </div>
    <div class="modal-actions">
      <button class="px-btn" onclick="closeShot()">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="/static/layout.js?v=3"></script>
<script src="/static/grok.js?v=1"></script>
</body>
</html>
