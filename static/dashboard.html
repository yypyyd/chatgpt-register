<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · ChatGPT 注册管理</title>
<link rel="stylesheet" href="/static/style.css?v=19">
</head>
<body data-page="dashboard">
<div class="layout">
  <main class="main">
    <h1 class="page-title">仪表盘</h1>

    <!-- 浏览器就绪/下载进度（就绪后自动隐藏） -->
    <div class="browser-banner" id="browser-banner" style="display:none">
      <div class="bb-row">
        <span class="bb-ico" id="bb-ico">⬇</span>
        <span class="bb-msg" id="bb-msg">正在检查浏览器...</span>
        <span class="bb-pct" id="bb-pct"></span>
      </div>
      <div class="bb-progress"><div class="bb-progress-bar" id="bb-bar" style="width:0%"></div></div>
    </div>

    <div class="dash">
      <div class="dash-row">
        <section class="dash-hero">
          <div class="hero-label">已注册账号 · 全部渠道</div>
          <div class="hero-num"><b class="num" id="sum-registered">0</b><span class="hero-pill">今日 +<span class="num" id="sum-today">0</span></span></div>
          <div class="hero-sub">近 7 天新增 <span class="num" id="sum-week">0</span> 个</div>
          <svg class="hero-spark" id="hero-spark" aria-hidden="true"></svg>
        </section>
        <section class="dash-card dash-metrics">
          <div class="metric">
            <div class="metric-top"><span class="metric-ico"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>在跑任务<span class="live-dot" id="live-dot" hidden></span></div>
            <b class="num" id="sum-running">0</b>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="metric-ico"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z"/></svg></span>可出库库存</div>
            <b class="num" id="sum-unshipped">0</b>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="metric-ico"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></span>注册失败</div>
            <b class="num" id="sum-failed">0</b>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="metric-ico"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>可用邮箱</div>
            <b class="num"><span id="sum-mailbox">0</span><small> / <span id="sum-mailbox-total">0</span></small></b>
          </div>
        </section>
      </div>

      <div class="dash-section"><h2>渠道</h2><span class="dash-cap">点卡片进入对应注册页</span></div>
      <div class="ch-grid" id="ch-grid"></div>

      <div class="dash-row">
        <section class="dash-card">
          <div class="dash-head"><h2>近 7 天产量</h2><div class="legend" id="trend-legend"></div></div>
          <div class="chart">
            <div class="chart-plot"><div id="chart-grid"></div><div class="chart-cols" id="chart-cols"></div></div>
            <div class="chart-x" id="chart-x"></div>
          </div>
        </section>
        <section class="dash-card">
          <div class="dash-head"><h2>已注册渠道占比</h2></div>
          <div class="share">
            <div class="share-ring">
              <svg viewBox="0 0 140 140" id="share-svg" aria-hidden="true"></svg>
              <div class="share-center"><b class="num" id="share-total">0</b><span>已注册</span></div>
            </div>
            <div class="share-list" id="share-list"></div>
          </div>
        </section>
      </div>

      <section class="dash-card">
        <div class="dash-head"><h2>最近注册</h2><span class="dash-cap">全部渠道 · 最新 10 条</span></div>
        <div id="recent"></div>
      </section>
    </div>
  </main>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script src="/static/layout.js?v=10"></script>
<script>
const CH = {
  chatgpt:  { name: 'GPT',      nav: 'accounts', color: '#7c3aed', soft: '#ede9fe' },
  grok:     { name: 'Grok',     nav: 'grok',     color: '#d97706', soft: '#fef3c7' },
  adobe:    { name: 'Adobe',    nav: 'adobe',    color: '#16a34a', soft: '#dcfce7' },
  leonardo: { name: 'Leonardo', nav: 'leonardo', color: '#0f766e', soft: '#ccfbf1' },
  lovart:   { name: 'Lovart',   nav: 'lovart',   color: '#2563eb', soft: '#dbeafe' },
};
const STATUS_LABEL = {
  pending: '待生产', registering: '注册中', waiting_code: '等待验证码', registered: '已注册',
  register_failed: '注册失败', register_rejected: '拒绝(Terms)', already_registered: '已存在', account_exists: '已存在',
};

const chOf = k => CH[k] || { name: k, nav: '', color: '#7c6cf6', soft: '#f2efff' };
const chStyle = k => `--ch:${chOf(k).color};--ch-soft:${chOf(k).soft}`;
function set(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

function statusLabel(ch, st) {
  if (ch === 'chatgpt' && st === 'already_registered') return '停用';
  return STATUS_LABEL[st] || st;
}

function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
  return new Date(t).toLocaleDateString();
}

// 平滑曲线：Catmull-Rom 转三次贝塞尔，控制点夹在数据范围内，避免零值附近冲到基线以下。
function sparkPath(pts, yMin, yMax) {
  const clamp = y => Math.min(yMax, Math.max(yMin, y));
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, clamp(p1[1] + (p2[1] - p0[1]) / 6)];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, clamp(p2[1] - (p3[1] - p1[1]) / 6)];
    d += ` C${c1} ${c2} ${p2}`;
  }
  return d;
}

function renderHero(s, totals) {
  set('sum-registered', s.registered || 0);
  set('sum-today', s.today || 0);
  set('sum-week', totals.reduce((a, n) => a + n, 0));
  const svg = document.getElementById('hero-spark');
  const w = svg.clientWidth, h = svg.clientHeight;
  if (!w || !h || totals.length < 2) { svg.innerHTML = ''; return; }
  const max = Math.max(1, ...totals), top = 18, bottom = 16, right = 22;
  const pts = totals.map((v, i) => [i * (w - right) / (totals.length - 1), h - bottom - v / max * (h - top - bottom)]);
  const line = sparkPath(pts, top, h - bottom), [lx, ly] = pts[pts.length - 1];
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `
    <defs><linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L${lx},${h} L0,${h} Z" fill="url(#spark-fill)"/>
    <path d="${line}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="9" fill="#fff" fill-opacity=".25"/>
    <circle cx="${lx}" cy="${ly}" r="4" fill="#fff"/>`;
}

function renderMetrics(s) {
  set('sum-running', s.running || 0);
  document.getElementById('live-dot').hidden = !(s.running > 0);
  set('sum-unshipped', s.unshipped || 0);
  const failed = document.getElementById('sum-failed');
  failed.textContent = s.failed || 0;
  failed.classList.toggle('bad', (s.failed || 0) > 0);
  set('sum-mailbox', s.mailbox_verified || 0);
  set('sum-mailbox-total', s.mailboxes || 0);
}

function renderChannels(list) {
  document.getElementById('ch-grid').innerHTML = list.map(c => {
    const state = c.producing ? `<span class="ch-state"><span class="live-dot"></span>在跑 ${c.running_num || 0}</span>` : '';
    const cap = c.key === 'chatgpt' && c.registered ? `已注册 · 母号 ${c.mother || 0} · 裂变 ${c.fission || 0}` : '已注册';
    let run = '';
    if (c.producing && c.target > 0) {
      const done = c.run_registered || 0, pct = Math.min(100, Math.round(done / c.target * 100));
      run = `<div class="ch-run"><span>本次 ${done}/${c.target}</span><div class="ch-bar"><i style="width:${pct}%"></i></div></div>`;
    } else if (c.producing && c.pending > 0) {
      run = `<div class="ch-run">待生产 ${c.pending}</div>`;
    }
    return `<a class="ch-card${c.total ? '' : ' empty'}" href="${esc(c.page)}" style="${chStyle(c.key)}">
      <div class="ch-head"><span class="ch-ico">${navIcon(chOf(c.key).nav)}</span><span class="ch-name">${esc(c.name)}</span>${state}</div>
      <div class="ch-num num">${c.registered || 0}</div>
      <div class="ch-cap">${cap}</div>
      <div class="ch-stats">
        <div><b class="num">${c.in_progress || 0}</b><span>注册中</span></div>
        <div><b class="num${c.failed ? ' bad' : ''}">${c.failed || 0}</b><span>失败</span></div>
        <div><b class="num">${c.unshipped || 0}</b><span>未出库</span></div>
      </div>${run}
    </a>`;
  }).join('');
}

function niceStep(v) {
  if (v <= 1) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function renderTrend(trend, totals, list) {
  const keys = list.map(c => c.key);
  const step = niceStep(Math.max(0, ...totals) / 4), max = step * 4;
  document.getElementById('chart-grid').innerHTML = [0, 1, 2, 3, 4].map(i =>
    `<div class="chart-line${i ? '' : ' base'}" style="bottom:${i * 25}%"><span class="num">${step * i}</span></div>`).join('');
  document.getElementById('chart-cols').innerHTML = trend.map((t, i) => {
    const counts = t.counts || {}, total = totals[i];
    if (!total) return '<div class="chart-col"></div>';
    const used = keys.filter(k => counts[k] > 0);
    const segs = used.map(k => `<div class="chart-seg" style="height:${counts[k] / total * 100}%;background:${chOf(k).color}"></div>`).join('');
    const tip = used.map(k => `${chOf(k).name} ${counts[k]}`).join(' · ');
    return `<div class="chart-col" title="${esc(t.date)} · ${esc(tip)}"><div class="chart-stack" style="height:${total / max * 100}%"><span class="chart-val num">${total}</span><div class="chart-bar">${segs}</div></div></div>`;
  }).join('');
  document.getElementById('chart-x').innerHTML = trend.map((t, i) => i === trend.length - 1
    ? '<span class="today">今天</span>'
    : `<span>${esc((t.date || '').slice(5).replace('-', '/'))}</span>`).join('');
  const active = keys.filter(k => trend.some(t => (t.counts || {})[k] > 0));
  document.getElementById('trend-legend').innerHTML = active.map(k =>
    `<span><i style="background:${chOf(k).color}"></i>${esc(chOf(k).name)}</span>`).join('');
}

function renderShare(list) {
  const parts = list.filter(c => c.registered > 0);
  const sum = parts.reduce((a, c) => a + c.registered, 0);
  set('share-total', sum);
  const r = 58, C = 2 * Math.PI * r, gap = parts.length > 1 ? 3 : 0;
  let off = 0;
  const arcs = parts.map(c => {
    const len = c.registered / sum * C;
    const arc = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${chOf(c.key).color}" stroke-width="12" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
    return arc;
  }).join('');
  document.getElementById('share-svg').innerHTML = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="#f1eff9" stroke-width="12"/>` + arcs;
  document.getElementById('share-list').innerHTML = parts.length
    ? parts.map(c => `<div class="share-item"><i style="background:${chOf(c.key).color}"></i>${esc(c.name)}<b class="num">${c.registered}</b><em class="num">${Math.round(c.registered / sum * 100)}%</em></div>`).join('')
    : '<div class="dash-empty">暂无已注册账号</div>';
}

function renderRecent(rows) {
  const box = document.getElementById('recent');
  if (!rows || !rows.length) { box.innerHTML = '<div class="dash-empty">还没有注册记录</div>'; return; }
  box.innerHTML = rows.map(x => `
    <div class="rc-row">
      <div class="rc-who">
        <span class="ch-ico" style="${chStyle(x.channel)}">${navIcon(chOf(x.channel).nav)}</span>
        <div class="rc-text"><div class="rc-email">${esc(x.email)}</div><div class="rc-ch">${esc(chOf(x.channel).name)}</div></div>
      </div>
      <span class="badge ${esc(x.status)}">${esc(statusLabel(x.channel, x.status))}</span>
      <span class="rc-time" title="${esc(fmtTime(x.created_at))}">${ago(x.created_at)}</span>
    </div>`).join('');
}

async function loadDashboard() {
  const d = await (await api('/api/stats')).json();
  const list = d.channels || [], trend = d.trend || [];
  const totals = trend.map(t => Object.values(t.counts || {}).reduce((a, n) => a + n, 0));
  renderHero(d.summary || {}, totals);
  renderMetrics(d.summary || {});
  renderChannels(list);
  renderTrend(trend, totals, list);
  renderShare(list);
  renderRecent(d.recent);
}

async function loadBrowser() {
  let s;
  try { s = await (await api('/api/browser/status')).json(); } catch (e) { return; }
  const banner = document.getElementById('browser-banner');
  if (s.ready) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.className = 'browser-banner' + (s.phase === 'error' ? ' err' : '');
  document.getElementById('bb-ico').textContent = s.phase === 'error' ? '⚠' : '⬇';
  document.getElementById('bb-msg').textContent = s.message || '缺少浏览器';
  const pct = s.percent || 0;
  document.getElementById('bb-pct').textContent = (s.phase === 'downloading' || s.phase === 'unzip') ? pct + '%' : '';
  document.getElementById('bb-bar').style.width = (s.phase === 'error' ? 100 : pct) + '%';
}

loadDashboard();
loadBrowser();
setInterval(loadDashboard, 4000);
setInterval(loadBrowser, 2000);
</script>
</body>
</html>
