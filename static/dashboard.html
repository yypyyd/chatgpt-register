<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · ChatGPT 注册管理</title>
<link rel="stylesheet" href="/static/style.css?v=18">
</head>
<body data-page="dashboard">
<div class="layout">
  <main class="main">
    <h1 class="page-title">仪表盘</h1>

    <!-- 浏览器就绪/下载进度（就绪后自动隐藏） -->
    <div class="browser-banner" id="browser-banner" style="display:none">
      <div class="bb-row">
        <span class="bb-ico" id="bb-ico">⬇</span>
        <span class="bb-msg" id="bb-msg">正在检查浏览器...</span>
        <span class="bb-pct" id="bb-pct"></span>
      </div>
      <div class="bb-progress"><div class="bb-progress-bar" id="bb-bar" style="width:0%"></div></div>
    </div>

    <!-- 全渠道汇总 -->
    <div class="stats">
      <div class="stat-box green"><div class="stat-info"><div class="stat-num" id="sum-registered">0</div><div class="stat-label">已注册（全部渠道）</div></div><div class="stat-ico">✓</div></div>
      <div class="stat-box blue"><div class="stat-info"><div class="stat-num" id="sum-today">0</div><div class="stat-label">今日新增</div></div><div class="stat-ico">↑</div></div>
      <div class="stat-box cyan"><div class="stat-info"><div class="stat-num" id="sum-running">0</div><div class="stat-label">在跑任务</div></div><div class="stat-ico">◔</div></div>
      <div class="stat-box red"><div class="stat-info"><div class="stat-num" id="sum-failed">0</div><div class="stat-label">注册失败</div></div><div class="stat-ico">✕</div></div>
      <div class="stat-box violet"><div class="stat-info"><div class="stat-num" id="sum-unshipped">0</div><div class="stat-label">可出库库存</div></div><div class="stat-ico">⇪</div></div>
      <div class="stat-box amber"><div class="stat-info"><div class="stat-num" id="sum-mailbox">0</div><div class="stat-label">可用邮箱（共 <span id="sum-mailbox-total">0</span>）</div></div><div class="stat-ico">✉</div></div>
    </div>

    <!-- 各渠道概览：点卡片进入对应注册页 -->
    <div class="ch-grid" id="ch-grid"></div>

    <div class="dash-grid">
      <div class="px-panel dash-wide">
        <h2>近 7 天产量</h2>
        <div class="bars" id="trend-bars"></div>
        <div class="trend-legend" id="trend-legend"></div>
      </div>
      <div class="px-panel">
        <h2>已注册渠道占比</h2>
        <div class="donut-wrap">
          <div class="donut" id="donut"><div class="donut-hole"><div class="donut-total" id="donut-total">0</div><div class="donut-sub">已注册</div></div></div>
          <div class="donut-legend" id="donut-legend"></div>
        </div>
      </div>
    </div>

    <!-- 最近注册（全部渠道） -->
    <div class="px-panel dash-recent">
      <h2>最近注册</h2>
      <table class="px-table">
        <thead><tr><th>渠道</th><th>邮箱</th><th>状态</th><th>创建时间</th></tr></thead>
        <tbody id="dash-rows"></tbody>
      </table>
    </div>
  </main>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script src="/static/layout.js?v=9"></script>
<script>
const CH_COLOR = { chatgpt: '#7c3aed', grok: '#d97706', adobe: '#16a34a', leonardo: '#0f766e', lovart: '#2563eb' };
const CH_NAME = { chatgpt: 'GPT', grok: 'Grok', adobe: 'Adobe', leonardo: 'Leonardo', lovart: 'Lovart' };
const STATUS_LABEL = {
  pending: '待生产', registering: '注册中', waiting_code: '等待验证码', registered: '已注册',
  register_failed: '注册失败', register_rejected: '拒绝(Terms)', already_registered: '已存在', account_exists: '已存在',
};

function set(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

function statusLabel(ch, st) {
  if (ch === 'chatgpt' && st === 'already_registered') return '停用';
  return STATUS_LABEL[st] || st;
}

function renderChannels(list) {
  document.getElementById('ch-grid').innerHTML = list.map(c => {
    const state = c.producing
      ? `<span class="ch-state on">生产中 · 在跑 ${c.running_num || 0}</span>`
      : '<span class="ch-state">空闲</span>';
    let extra = '';
    if (c.key === 'chatgpt') extra += `<div class="ch-sub">母号 ${c.mother || 0} · 裂变 ${c.fission || 0}</div>`;
    if (c.producing && c.target > 0) {
      const done = c.run_registered || 0;
      const pct = Math.min(100, Math.round(done / c.target * 100));
      extra += `<div class="ch-run"><span>本次 ${done} / ${c.target}</span><div class="ch-progress"><div style="width:${pct}%"></div></div></div>`;
    } else if (c.producing && c.pending > 0) {
      extra += `<div class="ch-sub">待生产 ${c.pending}</div>`;
    }
    return `<a class="ch-card" href="${esc(c.page)}" style="--ch:${CH_COLOR[c.key] || 'var(--primary)'}">
      <div class="ch-head"><span class="ch-dot"></span><span class="ch-name">${esc(c.name)}</span>${state}</div>
      <div class="ch-main"><b>${c.registered || 0}</b><span>已注册</span></div>
      <div class="ch-meta">
        <span>注册中 <b>${c.in_progress || 0}</b></span>
        <span>失败 <b class="${c.failed ? 'red' : ''}">${c.failed || 0}</b></span>
        <span>未出库 <b>${c.unshipped || 0}</b></span>
      </div>${extra}
    </a>`;
  }).join('');
}

function renderTrend(trend, list) {
  const keys = list.map(c => c.key);
  const totals = trend.map(t => keys.reduce((a, k) => a + ((t.counts || {})[k] || 0), 0));
  const max = Math.max(1, ...totals);
  document.getElementById('trend-bars').innerHTML = trend.map((t, i) => {
    const total = totals[i], counts = t.counts || {};
    const segs = keys.filter(k => counts[k] > 0).map(k =>
      `<div class="bar-seg" style="height:${counts[k] / total * 100}%;background:${CH_COLOR[k]}" title="${CH_NAME[k] || k} ${counts[k]}"></div>`).join('');
    const h = total ? Math.max(4, Math.round(total / max * 100)) : 2;
    return `<div class="bar-col"><span class="bar-val">${total}</span><div class="bar-stack" style="height:${h}%">${segs}</div><span class="bar-lbl">${(t.date || '').slice(5)}</span></div>`;
  }).join('');
  document.getElementById('trend-legend').innerHTML = list.map(c =>
    `<span class="tl-item"><span class="lg-dot" style="background:${CH_COLOR[c.key]}"></span>${esc(c.name)}</span>`).join('');
}

function renderDonut(list) {
  const parts = list.filter(c => c.registered > 0);
  const sum = parts.reduce((a, c) => a + c.registered, 0);
  const donut = document.getElementById('donut');
  const legend = document.getElementById('donut-legend');
  set('donut-total', sum);
  if (!sum) {
    donut.style.background = 'conic-gradient(#eef0f5 0 100%)';
    legend.innerHTML = '<div class="lg-empty">暂无已注册账号</div>';
    return;
  }
  let acc = 0;
  const seg = parts.map(c => {
    const from = acc / sum * 100, to = (acc + c.registered) / sum * 100;
    acc += c.registered;
    return `${CH_COLOR[c.key]} ${from}% ${to}%`;
  });
  donut.style.background = 'conic-gradient(' + seg.join(',') + ')';
  legend.innerHTML = parts.map(c =>
    `<div class="lg-item"><span class="lg-dot" style="background:${CH_COLOR[c.key]}"></span>${esc(c.name)}<b>${c.registered}</b><span class="lg-pct">${(c.registered / sum * 100).toFixed(0)}%</span></div>`
  ).join('');
}

function renderRecent(rows) {
  document.getElementById('dash-rows').innerHTML = (rows || []).map(x => `
    <tr>
      <td><span class="ch-tag" style="--ch:${CH_COLOR[x.channel] || 'var(--primary)'}"><span class="ch-dot"></span>${esc(CH_NAME[x.channel] || x.channel)}</span></td>
      <td>${esc(x.email)}</td>
      <td><span class="badge ${esc(x.status)}">${esc(statusLabel(x.channel, x.status))}</span></td>
      <td>${fmtTime(x.created_at)}</td>
    </tr>`).join('') || '<tr><td colspan="4">暂无数据</td></tr>';
}

async function loadDashboard() {
  const d = await (await api('/api/stats')).json();
  const s = d.summary || {};
  set('sum-registered', s.registered || 0);
  set('sum-today', s.today || 0);
  set('sum-running', s.running || 0);
  set('sum-failed', s.failed || 0);
  set('sum-unshipped', s.unshipped || 0);
  set('sum-mailbox', s.mailbox_verified || 0);
  set('sum-mailbox-total', s.mailboxes || 0);
  const list = d.channels || [];
  renderChannels(list);
  renderTrend(d.trend || [], list);
  renderDonut(list);
  renderRecent(d.recent);
}

async function loadBrowser() {
  let s;
  try { s = await (await api('/api/browser/status')).json(); } catch (e) { return; }
  const banner = document.getElementById('browser-banner');
  if (s.ready) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.className = 'browser-banner' + (s.phase === 'error' ? ' err' : '');
  document.getElementById('bb-ico').textContent = s.phase === 'error' ? '⚠' : '⬇';
  document.getElementById('bb-msg').textContent = s.message || '缺少浏览器';
  const pct = s.percent || 0;
  document.getElementById('bb-pct').textContent = (s.phase === 'downloading' || s.phase === 'unzip') ? pct + '%' : '';
  document.getElementById('bb-bar').style.width = (s.phase === 'error' ? 100 : pct) + '%';
}

loadDashboard();
loadBrowser();
setInterval(loadDashboard, 4000);
setInterval(loadBrowser, 2000);
</script>
</body>
</html>
